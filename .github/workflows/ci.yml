name: CI - Frontend Web

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    name: Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Sin --max-warnings: los avisos no frenan el CI, los errores sí.
      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      # tsx no es dependencia del proyecto; se fija la mayor para que el CI sea estable.
      - name: Run unit tests
        run: npx --yes tsx@4 --test lib/*.test.ts

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-for-ci
          NEXT_PUBLIC_API_URL: https://placeholder.api.com/api/v1
